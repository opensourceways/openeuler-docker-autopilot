# 看板鲲鹏域当前 level_auto=L5 的软件（严格快照，重新生成会覆盖旧条目）。
# docker 目标在 openeuler-docker-images 的 {app, domain} 目录；
# conda 目标在 openeuler/conda-ecopkgs 的 packages/{package} 目录。
# version 取看板 latest_release，source_url 取看板 repo_url。
# 生成：python scripts/utils/fetch_l5_apps.py --repo ... --conda-repo ...
apps:
- name: apptainer
  conda:
    package: apptainer
  version: 1.5.5
  source_url: https://github.com/apptainer/apptainer
- name: batchelor
  conda:
    package: bioconductor-batchelor
  version: 1.28.0
  source_url: https://bioconductor.org/packages/3.20/bioc/html/batchelor.html
- name: genomation
  conda:
    package: bioconductor-genomation
  version: 1.44.0
  source_url: https://bioconductor.org/packages/3.20/bioc/html/genomation.html
- name: kebabs
  conda:
    package: bioconductor-kebabs
  version: 1.40.0
  source_url: https://bioconductor.org/packages/3.20/bioc/html/kebabs.html
- name: monocle
  conda:
    package: bioconductor-monocle
  version: 2.34.0
  source_url: https://bioconductor.org/packages/3.20/bioc/html/monocle.html
- name: DELFT3D
  conda:
    package: delft3d4
  version: '2027.01'
  source_url: https://github.com/deltares/delft3d
- name: Expat
  conda:
    package: expat
  version: 2.11.0
  source_url: https://github.com/libexpat/libexpat
- name: Kubernetes
  docker:
    app: kubernetes
    domain: Cloud
  version: 1.37.3
  source_url: https://github.com/kubernetes/kubernetes
- name: MySQL
  docker:
    app: mysql
    domain: Database
  version: 26.10.0.1
  source_url: https://github.com/mysql/mysql-server
- name: OpenFOAM
  docker:
    app: openfoam
    domain: HPC
  version: '20261113'
  source_url: https://github.com/openfoam/openfoam-dev
- name: Trinity
  docker:
    app: trinity
    domain: HPC
  conda:
    package: trinity
  version: 2.16.3
  source_url: https://github.com/trinityrnaseq/trinityrnaseq
- name: edk2
  docker:
    app: edk2
    domain: Others
  version: '202611'
  source_url: https://github.com/tianocore/edk2
- name: Erlang
  docker:
    app: erlang
    domain: Others
  conda:
    package: erlang
  version: 29.1.3
  source_url: https://github.com/erlang/otp
- name: Jenkins
  docker:
    app: jenkins
    domain: Others
  version: '2.592'
  source_url: https://github.com/jenkinsci/jenkins
- name: ScaNN
  docker:
    app: scann
    domain: Others
  version: 4a7bc8ab0bc770e71a259b7966c500496b99010a
  source_url: https://github.com/google-research/google-research
- name: Shiny
  docker:
    app: shiny
    domain: Others
  conda:
    package: r-shiny
  version: 1.15.0
  source_url: https://github.com/rstudio/shiny
