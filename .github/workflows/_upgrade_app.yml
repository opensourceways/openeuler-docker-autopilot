name: Upgrade one app

# 场景二的单应用流水线（由 upgrade_upstream_versions.yml 按应用矩阵调用）：
#   prepare（AI 依证据包生成 Dockerfile + 补测试 + 确定性元数据登记 + 推分支）
#   → 双架构原生验证 → 跨仓 PR
#
# 一应用一 PR：任一架构验证失败则不开 PR，分支保留供人工/修复组件继续处理。
#
# repair 模式（由 repair_upgrade.yml 调用）：prepare 不重新生成分支，而是下载失败
# 运行的 task-spec + 双架构 evidence，在已有分支上按失败证据与人工说明修复
# Dockerfile / tests/test.sh，然后走同一套验证与开 PR。

on:
  workflow_call:
    inputs:
      item:
        description: 'upgrade_scan 产出的单条 item JSON（repair 模式可留空）'
        required: false
        default: ''
        type: string
      app:
        required: true
        type: string
      domain:
        required: false
        default: ''
        type: string
      version:
        required: false
        default: ''
        type: string
      os_version:
        required: false
        default: ''
        type: string
      source_url:
        required: false
        default: ''
        type: string
      repair_run_id:
        description: '失败运行 ID；非空时只修复已有分支，不重新生成'
        required: false
        default: ''
        type: string
      repair_instructions:
        description: 'repair 模式下给 AI 的修复说明'
        required: false
        default: ''
        type: string
      x64_runner_labels:
        required: false
        default: '["self-hosted","Linux","X64","oe-upgrade-x64"]'
        type: string
      arm64_runner_labels:
        required: false
        default: '["self-hosted","Linux","ARM64","oe-upgrade-arm64"]'
        type: string
      build_timeout_minutes:
        description: >-
          单架构原生验证预算（分钟）。upgrade_scan 会从
          config/app-notes/<app>.md 的 build_timeout_minutes 带入。
        required: false
        default: '180'
        type: string
      prepare_timeout_minutes:
        description: >-
          生成/修复 job 预算（分钟）。upgrade_scan 会从
          config/app-notes/<app>.md 的 prepare_timeout_minutes 带入。
        required: false
        default: '240'
        type: string
    secrets:
      GITCODE_TOKEN:
        required: true
      AI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false

permissions:
  # repair 模式要从失败运行下载 task-spec / evidence artifact。
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  TARGET_REPO: openeuler/openeuler-docker-images
  TARGET_BRANCH: master
  # 生成/修复阶段会在容器里逐条重放 Dockerfile：给本 run 的容器与镜像打标签，
  # 便于收尾按标签清理，且不会误伤同一台机器上并发运行的其他 job。
  OE_CI_FIX_LABEL: oe.upgrade=${{ github.run_id }}-${{ github.run_attempt }}
  AI_RUNNER: ${{ vars.AI_RUNNER || 'opencode' }}
  AI_MODEL: ${{ vars.AI_MODEL || 'gateway/deepseek-v4-pro' }}
  AI_PROVIDER_ID: ${{ vars.AI_PROVIDER_ID || 'gateway' }}
  AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '10800000' }}
  AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  OPENAI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  DEEPSEEK_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  OPENAI_BASE_URL: >-
    ${{ vars.OPENAI_BASE_URL || 'https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1' }}

jobs:

  prepare:
    name: >-
      ${{ inputs.repair_run_id != '' &&
          format('Repair {0} (from run {1})', inputs.app, inputs.repair_run_id) ||
          format('Prepare {0} -> {1}', inputs.app, inputs.version) }}
    runs-on: ${{ fromJSON(inputs.x64_runner_labels) }}
    # 生成 + 容器内逐条重放 + 当场修 放在一个 job 里；预算按应用注意点文档调整。
    timeout-minutes: ${{ fromJSON(inputs.prepare_timeout_minutes) }}
    outputs:
      branch: ${{ steps.apply.outputs.branch || steps.repair.outputs.branch }}
      test_status: ${{ steps.apply.outputs.test_status || steps.repair.outputs.test_status }}
      push_repo: ${{ steps.apply.outputs.push_repo || steps.repair.outputs.push_repo }}
      item_json: ${{ steps.repair.outputs.item_json }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: x86_64
          preflight: "true"

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Clone target repository
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          # 必须完整克隆：后面要 push 分支，GitCode 拒收浅克隆推上来的分支。
          git clone \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${TARGET_REPO}.git" \
            source-repo

      - name: Generate Dockerfile and apply upgrade
        id: apply
        if: ${{ inputs.repair_run_id == '' }}
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_FORK_REPO: ${{ vars.GITCODE_FORK_REPO }}
          GIT_COMMIT_NAME: ${{ vars.GIT_COMMIT_NAME }}
          GIT_COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}
          SOURCE_REPO_DIR: ${{ github.workspace }}/source-repo
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
          ITEM: ${{ inputs.item }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/upgrade_apply.py \
            --item "$ITEM" \
            --task-spec-out "${RUNNER_TEMP}/task-spec.json"

      - name: Download failed run task spec
        if: ${{ inputs.repair_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-task-${{ inputs.app }}-${{ inputs.repair_run_id }}
          path: ${{ runner.temp }}/repair-source/task
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repair_run_id }}

      - name: Download failed run evidence (x86_64)
        if: ${{ inputs.repair_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-evidence-${{ inputs.app }}-x86_64
          path: ${{ runner.temp }}/repair-source/evidence/x86_64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repair_run_id }}

      - name: Download failed run evidence (aarch64)
        if: ${{ inputs.repair_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-evidence-${{ inputs.app }}-aarch64
          path: ${{ runner.temp }}/repair-source/evidence/aarch64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repair_run_id }}

      # 只修复已有分支：不切新分支、不重跑首次生成；分支不存在时脚本直接失败。
      - name: Repair existing upgrade branch
        id: repair
        if: ${{ inputs.repair_run_id != '' }}
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_FORK_REPO: ${{ vars.GITCODE_FORK_REPO }}
          GIT_COMMIT_NAME: ${{ vars.GIT_COMMIT_NAME }}
          GIT_COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}
          SOURCE_REPO_DIR: ${{ github.workspace }}/source-repo
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
          TASK_SPEC: ${{ runner.temp }}/repair-source/task/task-spec.json
          INSTRUCTIONS: ${{ inputs.repair_instructions }}
          EVIDENCE_X86: ${{ runner.temp }}/repair-source/evidence/x86_64
          EVIDENCE_ARM: ${{ runner.temp }}/repair-source/evidence/aarch64
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/upgrade_repair.py \
            --task-spec "$TASK_SPEC" \
            --evidence-dir "$EVIDENCE_X86" \
            --evidence-dir "$EVIDENCE_ARM" \
            --instructions "$INSTRUCTIONS" \
            --task-spec-out "${RUNNER_TEMP}/task-spec.json"

      - name: Upload task spec
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-task-${{ inputs.app }}-${{ github.run_id }}
          path: ${{ runner.temp }}/task-spec.json

      # Agent 可能自建名字不可控的容器/镜像，按 run 标签清理。
      - name: Cleanup run containers and images
        if: always()
        run: |
          ids=$(docker ps -aq --filter "label=${OE_CI_FIX_LABEL}" || true)
          if [ -n "${ids}" ]; then
            docker rm -f ${ids} || true
          fi
          imgs=$(docker images -aq --filter "label=${OE_CI_FIX_LABEL}" || true)
          if [ -n "${imgs}" ]; then
            docker image rm -f ${imgs} || true
          fi

  validate-x86_64:
    name: "Validate x86_64"
    needs: prepare
    runs-on: ${{ fromJSON(inputs.x64_runner_labels) }}
    timeout-minutes: ${{ fromJSON(inputs.build_timeout_minutes) }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tooling
        uses: ./.github/actions/phase1-setup
        with:
          arch: x86_64
          preflight: "true"

      - name: Download task spec
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-task-${{ inputs.app }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upgrade-task

      - name: Clone upgrade branch
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ needs.prepare.outputs.branch }}" \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${{ needs.prepare.outputs.push_repo }}.git" \
            source-repo

      - name: Validate natively (x86_64)
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/upgrade-evidence"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-validate \
            --workspace source-repo \
            --task-spec "${RUNNER_TEMP}/upgrade-task/task-spec.json" \
            --architecture x86_64 \
            --run-id "${{ github.run_id }}" \
            --report "${RUNNER_TEMP}/upgrade-evidence/x86_64.json" \
            --junit "${RUNNER_TEMP}/upgrade-evidence/x86_64.junit.xml"

      - name: Upload evidence (x86_64)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-evidence-${{ inputs.app }}-x86_64
          path: ${{ runner.temp }}/upgrade-evidence/

      # 校验步骤是 continue-on-error（为了保留证据），这里显式失败，
      # 否则 open-pr 仍会执行，编译错误会被直接丢给目标仓 CI。
      - name: Assert native validation passed (x86_64)
        env:
          REPORT: ${{ runner.temp }}/upgrade-evidence/x86_64.json
          APP: ${{ inputs.app }}
          RUN_ID: ${{ github.run_id }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -c \
            "import json,os,sys; p=os.environ['REPORT']; r=json.load(open(p)) if os.path.isfile(p) else {'status':'missing'}; s=r.get('status'); print(s); app=os.environ.get('APP',''); fl=[str(x.get('failure') or '').replace(chr(10),' | ') for x in (r.get('failures') or [])]; print('::error::'+(app+' x86_64 validation '+str(s)+': '+'; '.join(fl[:3])+'. 修复：运行 Repair upgrade branch 工作流，source_run_id='+os.environ.get('RUN_ID','')+'，app='+app)) if s!='passed' else None; sys.exit(0 if s=='passed' else 1)"

  validate-aarch64:
    name: "Validate aarch64"
    needs: prepare
    runs-on: ${{ fromJSON(inputs.arm64_runner_labels) }}
    timeout-minutes: ${{ fromJSON(inputs.build_timeout_minutes) }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tooling
        uses: ./.github/actions/phase1-setup
        with:
          arch: aarch64
          preflight: "true"

      - name: Download task spec
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-task-${{ inputs.app }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upgrade-task

      - name: Clone upgrade branch
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ needs.prepare.outputs.branch }}" \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${{ needs.prepare.outputs.push_repo }}.git" \
            source-repo

      - name: Validate natively (aarch64)
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/upgrade-evidence"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-validate \
            --workspace source-repo \
            --task-spec "${RUNNER_TEMP}/upgrade-task/task-spec.json" \
            --architecture aarch64 \
            --run-id "${{ github.run_id }}" \
            --report "${RUNNER_TEMP}/upgrade-evidence/aarch64.json" \
            --junit "${RUNNER_TEMP}/upgrade-evidence/aarch64.junit.xml"

      - name: Upload evidence (aarch64)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-evidence-${{ inputs.app }}-aarch64
          path: ${{ runner.temp }}/upgrade-evidence/

      - name: Assert native validation passed (aarch64)
        env:
          REPORT: ${{ runner.temp }}/upgrade-evidence/aarch64.json
          APP: ${{ inputs.app }}
          RUN_ID: ${{ github.run_id }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -c \
            "import json,os,sys; p=os.environ['REPORT']; r=json.load(open(p)) if os.path.isfile(p) else {'status':'missing'}; s=r.get('status'); print(s); app=os.environ.get('APP',''); fl=[str(x.get('failure') or '').replace(chr(10),' | ') for x in (r.get('failures') or [])]; print('::error::'+(app+' aarch64 validation '+str(s)+': '+'; '.join(fl[:3])+'. 修复：运行 Repair upgrade branch 工作流，source_run_id='+os.environ.get('RUN_ID','')+'，app='+app)) if s!='passed' else None; sys.exit(0 if s=='passed' else 1)"

  open-pr:
    name: "Open PR for ${{ inputs.app }}"
    needs: [prepare, validate-x86_64, validate-aarch64]
    if: ${{ success() }}
    runs-on: ${{ fromJSON(inputs.x64_runner_labels) }}
    timeout-minutes: 20
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Create cross-repo PR
        id: pr
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          ITEM: ${{ needs.prepare.outputs.item_json || inputs.item }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/upgrade_open_pr.py \
            --item "$ITEM" \
            --branch "${{ needs.prepare.outputs.branch }}" \
            --push-repo "${{ needs.prepare.outputs.push_repo }}" \
            --test-status "${{ needs.prepare.outputs.test_status }}"
