name: Verify

# Reusable workflow: generate (adversarial pair) → build → test.
# Called by upgrade_upstream_versions.yml and upgrade_openeuler_versions.yml.
# On retry (retry=true): skips generation, only build+test — fixer changes are already applied.

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      app_version:
        type: string
      os_version:
        type: string
      oe_version:
        type: string
      scenario:
        required: true
        type: string
      retry:
        type: boolean
        default: false
    secrets:
      AI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    name: Generate image candidate
    # Skip generation on retry — fixer changes are already in the repo
    if: ${{ !inputs.retry }}
    runs-on: [self-hosted, Linux, x64]
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Run adversarial pair (image)
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gateway/deepseek-v4-pro' }}
          AI_PROVIDER_ID: ${{ vars.AI_PROVIDER_ID || 'gateway' }}
          OPENAI_BASE_URL: >-
            ${{ vars.OPENAI_BASE_URL || 'https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1' }}
          APP: ${{ inputs.app }}
          APP_VERSION: ${{ inputs.app_version }}
          OS_VERSION: ${{ inputs.os_version }}
          OE_VERSION: ${{ inputs.oe_version }}
          SCENARIO: ${{ inputs.scenario }}
        run: python scripts/harness/run.py adversarial-pair --role image

      - name: Validate meta
        run: python scripts/harness/validate_meta.py

      - name: Upload generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-files-${{ inputs.app }}
          path: |
            */**/Dockerfile
            */meta.yml
            */README.md
            */doc/

  build-and-test:
    name: Build and test image
    needs: generate
    if: ${{ !inputs.retry || always() }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: [self-hosted, Linux, x64]
            platform: linux/amd64
          - runner: [self-hosted, Linux, ARM64]
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated files
        if: ${{ !inputs.retry }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-files-${{ inputs.app }}

      - name: Build image
        run: |
          set -o pipefail
          APP="${{ inputs.app }}"
          docker buildx build \
            --platform ${{ matrix.arch.platform }} \
            --tag "openeuler/${APP}:test" \
            --load \
            . 2>&1 | tee /tmp/build-${{ matrix.arch.platform }}.log

      - name: Run tests
        run: |
          APP="${{ inputs.app }}"
          python scripts/harness/run.py test --app "$APP" --platform ${{ matrix.arch.platform }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ inputs.app }}-${{ matrix.arch.platform }}
          path: |
            /tmp/build-${{ matrix.arch.platform }}.log
            **/results/**/*.junit.xml