name: Watch GitCode new-version Issues

on:
  schedule:
    # 每 5 分钟轮询 GitCode 上的 【new-version】 Issue。
    # 固定跑在专用 runner 上，避免排在构建任务后面导致轮询卡住。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Exact GitCode Issue number; empty scans pending Issues"
        required: false
        type: string
      max_issues:
        description: "Maximum new Issues claimed in one scan run"
        required: false
        type: string
        default: "3"

permissions:
  actions: write
  contents: read

concurrency:
  group: phase2-gitcode-issue-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Claim upgrade requests
    # 专用轮询 runner：与镜像构建机隔离，5 分钟轮询不会被长任务卡住。
    # 需要换机器时设置 Variable ISSUE_POLL_RUNNER_LABELS（JSON 数组）。
    runs-on: >-
      ${{ fromJSON(vars.ISSUE_POLL_RUNNER_LABELS ||
          '["self-hosted","Linux","X64","oe-issue-poll"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate optional Issue number
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.issue_number != '' }}
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          case "${ISSUE_NUMBER}" in
            ''|*[!0-9]*|0)
              echo "issue_number must be a positive integer" >&2
              exit 2
              ;;
          esac

      - name: Claim Issues and dispatch scenario two
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MAX_ISSUES: ${{ inputs.max_issues || '3' }}
        run: |
          case "${MAX_ISSUES}" in
            ''|*[!0-9]*|0)
              echo "max_issues must be a positive integer" >&2
              exit 2
              ;;
          esac
          args=(
            --target-repo openeuler/openeuler-docker-images
            --github-repository "${GITHUB_REPOSITORY}"
            --github-ref "${GITHUB_REF_NAME}"
            --max-issues "${MAX_ISSUES}"
          )
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "${ISSUE_NUMBER}" ]; then
            args+=(--issue-number "${ISSUE_NUMBER}")
          fi
          python3 scripts/harness/flow.py upgrade-issue-watch "${args[@]}"
