name: Audit and fix one app

# 场景二的「已是最新版本」审计与修复（由 upgrade_upstream_versions.yml 调用）：
#   目标仓已有上游最新版本 → 不跳过 → AI 审计 Dockerfile / 证据对齐 / 版本正确性 /
#   测试脚本 → 发现问题时调用修复 Agent，更新 Dockerfile 与 doc/image-info.yml，
#   并确定性补齐 meta.yml / README 的版本登记（CI 以 meta.yml 为准）。
#
# 交付顺序与升级链路一致：先推修复分支，再跑双架构原生构建 + 功能测试，
# 两个架构都通过才开 PR，避免把编译错误直接丢给目标仓 CI。
# 审计/修复 Agent 返回的 app_note 会写回本仓 config/app-notes/<app>.md，并单独
# 开一个 auto/app-note/<app> 的 notes PR。

on:
  workflow_call:
    inputs:
      item:
        description: 'upgrade_scan 产出的单条 audit JSON'
        required: true
        type: string
      app:
        required: true
        type: string
      domain:
        required: true
        type: string
      version:
        required: true
        type: string
      os_version:
        required: true
        type: string
      runner_labels:
        description: >-
          架构无关 job（审计/修复/开 PR）的 runner 标签（JSON 数组）。
          runner 需同时带 oe-any 标签，X64 / ARM64 均可承接。
        required: false
        default: '["self-hosted","Linux","oe-any"]'
        type: string
      x64_runner_labels:
        description: 'x86_64 原生校验 job 的 runner 标签（JSON 数组）'
        required: false
        default: '["self-hosted","Linux","X64","oe-upgrade-x64"]'
        type: string
      arm64_runner_labels:
        description: 'aarch64 原生校验 job 的 runner 标签（必须 arm64）'
        required: false
        default: '["self-hosted","Linux","ARM64","oe-upgrade-arm64"]'
        type: string
      build_timeout_minutes:
        description: '单架构构建/校验预算（分钟）；矩阵会用 config/app-notes 覆盖'
        required: false
        default: '180'
        type: string
      prepare_timeout_minutes:
        description: '审计+修复+补测试预算（分钟）；矩阵会用 config/app-notes 覆盖'
        required: false
        default: '240'
        type: string
    secrets:
      GITCODE_TOKEN:
        required: true
      AI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false

permissions:
  # 审计/修复后向本仓推送 app-note 分支并开 notes PR。
  contents: write
  pull-requests: write

env:
  PYTHONUNBUFFERED: "1"
  TARGET_REPO: openeuler/openeuler-docker-images
  TARGET_BRANCH: master
  AI_RUNNER: ${{ vars.AI_RUNNER || 'opencode' }}
  AI_MODEL: ${{ vars.AI_MODEL || 'gateway/deepseek-v4-pro' }}
  AI_PROVIDER_ID: ${{ vars.AI_PROVIDER_ID || 'gateway' }}
  AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '10800000' }}
  AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  OPENAI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  DEEPSEEK_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  OPENAI_BASE_URL: >-
    ${{ vars.OPENAI_BASE_URL || 'https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1' }}
  GITCODE_FORK_REPO: ${{ vars.GITCODE_FORK_REPO }}
  GIT_COMMIT_NAME: ${{ vars.GIT_COMMIT_NAME }}
  GIT_COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}

jobs:

  # ── 审计 + 修复：只推分支，不开 PR ──────────────────────────────
  fix:
    name: "Audit and fix ${{ inputs.app }}"
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    # 审计 + 修复 + 补测试；长构建应用的预算由 config/app-notes 经矩阵传入。
    timeout-minutes: ${{ fromJSON(inputs.prepare_timeout_minutes) }}
    outputs:
      has_changes: ${{ steps.fix.outputs.has_changes }}
      branch: ${{ steps.fix.outputs.branch }}
      push_repo: ${{ steps.fix.outputs.push_repo }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          preflight: "true"

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Clone target repository
        uses: ./.github/actions/clone-retry
        with:
          # 修复会推分支，必须完整克隆；GitCode 拒收浅克隆推上来的分支。
          url: "https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.TARGET_REPO }}.git"
          destination: source-repo

      - name: Audit, fix and push branch
        id: fix
        env:
          ITEM: ${{ inputs.item }}
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/upgrade_audit.py \
            --item "$ITEM" \
            --repo source-repo \
            --out "${RUNNER_TEMP}/audit" \
            --prepare \
            --app-note-out "${RUNNER_TEMP}/app-note.md"

      - name: Upload audit report and task spec
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-audit-${{ inputs.app }}-${{ github.run_id }}
          path: ${{ runner.temp }}/audit/

      - name: Publish app note
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/publish_app_note.py \
            --task-spec "${RUNNER_TEMP}/audit/task-spec.json" \
            --app "${{ inputs.app }}" \
            --version "${{ inputs.version }}" \
            --os-version "${{ inputs.os_version }}" \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --note-file "${RUNNER_TEMP}/app-note.md"

  # ── 双架构原生校验：编译 + 功能测试，任一失败都不开 PR ──────────
  validate-x86_64:
    name: "Validate x86_64"
    needs: fix
    if: needs.fix.outputs.has_changes == 'true'
    runs-on: ${{ fromJSON(inputs.x64_runner_labels) }}
    timeout-minutes: ${{ fromJSON(inputs.build_timeout_minutes) }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tooling
        uses: ./.github/actions/phase1-setup
        with:
          arch: x86_64
          preflight: "true"

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Download task spec
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-audit-${{ inputs.app }}-${{ github.run_id }}
          path: ${{ runner.temp }}/audit

      - name: Clone repair branch
        uses: ./.github/actions/clone-retry
        with:
          url: "https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ needs.fix.outputs.push_repo }}.git"
          destination: source-repo
          branch: ${{ needs.fix.outputs.branch }}
          depth: "1"

      - name: Validate natively (x86_64)
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/audit-evidence"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-validate \
            --workspace source-repo \
            --task-spec "${RUNNER_TEMP}/audit/task-spec.json" \
            --architecture x86_64 \
            --run-id "${{ github.run_id }}" \
            --report "${RUNNER_TEMP}/audit-evidence/x86_64.json" \
            --junit "${RUNNER_TEMP}/audit-evidence/x86_64.junit.xml"

      - name: Upload evidence (x86_64)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-evidence-${{ inputs.app }}-x86_64
          path: ${{ runner.temp }}/audit-evidence/

      - name: Assert native validation passed (x86_64)
        env:
          REPORT: ${{ runner.temp }}/audit-evidence/x86_64.json
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -c \
            "import json,os,sys; r=json.load(open(os.environ['REPORT'])); print(r.get('status')); sys.exit(0 if r.get('status')=='passed' else 1)"

  validate-aarch64:
    name: "Validate aarch64"
    needs: fix
    if: needs.fix.outputs.has_changes == 'true'
    runs-on: ${{ fromJSON(inputs.arm64_runner_labels) }}
    timeout-minutes: ${{ fromJSON(inputs.build_timeout_minutes) }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tooling
        uses: ./.github/actions/phase1-setup
        with:
          arch: aarch64
          preflight: "true"

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Download task spec
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-audit-${{ inputs.app }}-${{ github.run_id }}
          path: ${{ runner.temp }}/audit

      - name: Clone repair branch
        uses: ./.github/actions/clone-retry
        with:
          url: "https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ needs.fix.outputs.push_repo }}.git"
          destination: source-repo
          branch: ${{ needs.fix.outputs.branch }}
          depth: "1"

      - name: Validate natively (aarch64)
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/audit-evidence"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-validate \
            --workspace source-repo \
            --task-spec "${RUNNER_TEMP}/audit/task-spec.json" \
            --architecture aarch64 \
            --run-id "${{ github.run_id }}" \
            --report "${RUNNER_TEMP}/audit-evidence/aarch64.json" \
            --junit "${RUNNER_TEMP}/audit-evidence/aarch64.junit.xml"

      - name: Upload evidence (aarch64)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-evidence-${{ inputs.app }}-aarch64
          path: ${{ runner.temp }}/audit-evidence/

      - name: Assert native validation passed (aarch64)
        env:
          REPORT: ${{ runner.temp }}/audit-evidence/aarch64.json
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -c \
            "import json,os,sys; r=json.load(open(os.environ['REPORT'])); print(r.get('status')); sys.exit(0 if r.get('status')=='passed' else 1)"

  # ── 交付：两个架构都通过才开 PR ─────────────────────────────────
  deliver:
    name: "Open PR for ${{ inputs.app }}"
    needs: [fix, validate-x86_64, validate-aarch64]
    if: ${{ success() && needs.fix.outputs.has_changes == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 20
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Download audit report and delivery context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-audit-${{ inputs.app }}-${{ github.run_id }}
          path: ${{ runner.temp }}/audit

      - name: Create fix PR
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/upgrade_audit.py \
            --open-pr \
            --delivery "${RUNNER_TEMP}/audit/delivery.json"
