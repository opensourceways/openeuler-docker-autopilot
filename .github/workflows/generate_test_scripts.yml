name: Generate Test Scripts

# 场景四（存量镜像功能测试补齐）：**手动指定一个软件**，AI Agent 按 KunpengTest
# 规范为它生成 tests/test.sh，静态校验通过后推送到 fork 并创建跨仓 PR
# （PR 同时给该软件最新 Dockerfile 追加一个空行，触发目标仓绑定在
# Dockerfile 变更上的构建 + 功能测试 CI）。
#
# 触发：仅 workflow_dispatch。由人指定 app（必要时用 domain 消歧），
# 一次运行只处理这一个软件，不轮询外部服务，也不批量扫描。
#
# 解析规则：在目标仓克隆里按目录名定位应用（大小写/分隔符不敏感），取版本号
# 最高的 `{domain}/{app}/{version}/{os_version}/Dockerfile`；应用不存在、同名跨域、
# 已有 test.sh、缺 Dockerfile 都会直接失败，不静默跳过。

on:
  workflow_dispatch:
    inputs:
      app:
        description: '应用名（目标仓目录名，如 kvrocks）'
        required: true
        type: string
      domain:
        description: '域目录（可选，同名应用出现在多个域时用来消歧，如 Database）'
        required: false
        type: string
      source_url:
        description: '上游仓库链接（可选，仅作为生成提示，如 https://github.com/xxx/yyy）'
        required: false
        type: string
      runner_labels:
        description: '本次运行使用的 runner 标签（JSON 数组），留空用 Variable / 默认值'
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_REPO: openeuler/openeuler-docker-images
  TARGET_BRANCH: master

concurrency:
  group: testgen-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  generate:
    name: "Generate test.sh for ${{ inputs.app }}"
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.TESTGEN_RUNNER_LABELS ||
          '["self-hosted","Linux","X64","oe-image-x86"]') }}
    timeout-minutes: 90
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          # 与场景二同一套锁定工具链（含 opencode）：不走 `curl | bash` 联网安装，
          # 自托管 Runner 只需能访问 GitHub release。
          arch: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Clone target repository
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          # 必须是完整克隆：GitCode 侧拒收浅克隆推上来的分支
          # （remote rejected: shallow update not allowed）。
          git clone \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${TARGET_REPO}.git" \
            source-repo

      - name: Resolve target app
        id: resolve
        env:
          SOURCE_REPO_DIR: ${{ github.workspace }}/source-repo
        run: |
          ARGS=(--repo "$SOURCE_REPO_DIR" --app "${{ inputs.app }}" --format github-output)
          if [ -n "${{ inputs.domain }}" ]; then
            ARGS+=(--domain "${{ inputs.domain }}")
          fi
          if [ -n "${{ inputs.source_url }}" ]; then
            ARGS+=(--source-url "${{ inputs.source_url }}")
          fi
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/harness/testgen_scan.py "${ARGS[@]}"

      - name: Generate test script and open PR
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gateway/deepseek-v4-pro' }}
          AI_PROVIDER_ID: ${{ vars.AI_PROVIDER_ID || 'gateway' }}
          OPENAI_BASE_URL: >-
            ${{ vars.OPENAI_BASE_URL || 'https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1' }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_FORK_REPO: ${{ vars.GITCODE_FORK_REPO }}
          GIT_COMMIT_NAME: ${{ vars.GIT_COMMIT_NAME }}
          GIT_COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
          SOURCE_REPO_DIR: ${{ github.workspace }}/source-repo
          TESTGEN_ITEM: ${{ steps.resolve.outputs.item }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/harness/testgen_generate.py --item "$TESTGEN_ITEM"
