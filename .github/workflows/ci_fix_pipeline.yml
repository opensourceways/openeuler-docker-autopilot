name: Fix PR CI failures

# 入口薄壳：真正的修复链路在公共组件 .github/workflows/_ci_repair.yml。
#
# 触发（只保留手动 / 显式调用，Monitor 的 cron 自动轮询已下线）：
#   workflow_dispatch    人工指定仓库与 PR 号，跑一次完整修复
#   repository_dispatch  API 显式调用（event_type: run-ci-fix）
run-name: "ci-fix PR#${{ github.event.client_payload.pr_number || github.event.inputs.pr_number || '?' }} · attempt ${{ github.event.client_payload.attempt || '1' }} · ${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}"

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '目标仓库（owner/repo，如 openeuler/openeuler-docker-images）'
        required: true
        default: 'openeuler/openeuler-docker-images'
      pr_number:
        description: 'PR 编号'
        required: true
        type: string
      source_platform:
        description: '平台：gitcode / github'
        required: false
        default: 'gitcode'
      # 三类 job 的 runner 标签都可覆盖（JSON 数组，留空则用 Variable / 默认值）。
      x64_runner_labels:
        description: 'prepare / 分析 / code-fix 的 runner 标签，JSON 数组'
        required: false
        type: string
      amd64_runner_labels:
        description: 'amd64 修复 job 的 runner 标签（需 Docker + ≥4 CPU），JSON 数组'
        required: false
        type: string
      arm64_runner_labels:
        description: 'arm64 修复/复验 job 的 runner 标签（必须 arm64），JSON 数组'
        required: false
        type: string
  repository_dispatch:
    types: [run-ci-fix]

concurrency:
  group: ci-fix-${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}-${{ github.event.client_payload.pr_number || github.event.inputs.pr_number }}
  cancel-in-progress: false

permissions:
  # ci-fix-log 数据分支的读写走本仓库 token；未配置 DISPATCH_TOKEN 时脚本回退到它
  contents: write

jobs:
  repair:
    name: Repair PR CI failures
    uses: ./.github/workflows/_ci_repair.yml
    secrets: inherit
    with:
      source_repo: ${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}
      pr_number: ${{ github.event.client_payload.pr_number || github.event.inputs.pr_number }}
      source_platform: >-
        ${{ github.event.client_payload.source_platform ||
            github.event.inputs.source_platform || 'gitcode' }}
      fix_pr_number: ${{ github.event.client_payload.fix_pr_number || '0' }}
      attempt: ${{ github.event.client_payload.attempt || '1' }}
      x64_runner_labels: ${{ github.event.inputs.x64_runner_labels || '' }}
      amd64_runner_labels: ${{ github.event.inputs.amd64_runner_labels || '' }}
      arm64_runner_labels: ${{ github.event.inputs.arm64_runner_labels || '' }}
