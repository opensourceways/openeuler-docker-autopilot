name: Fix PR CI failures

# 场景二：PR CI 失败自动修复链路（四阶段）。
#
# 一次修复会散成多条 run（链里有环，只能跑完再 dispatch），而 repository_dispatch
# 不建立 run 之间的父子关系，Actions 列表里它们看上去互不相干。把 PR 号、阶段名和
# chain_id 写进标题，就能一眼认出同一条链；chain_id 就是链路起点那个 run 的 id，
# 可直接跳回起点。起点 run 自己还没有 chain_id，故回退成它自己的 run_id。
run-name: "ci-fix PR#${{ github.event.client_payload.pr_number || github.event.inputs.pr_number || '?' }} · ${{ github.event.client_payload.phase || 'manual-trigger' }} · chain ${{ github.event.client_payload.chain_id || github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '目标仓库（owner/repo，如 openeuler/openeuler-docker-images）'
        required: true
        default: 'openeuler/openeuler-docker-images'
      pr_number:
        description: 'PR 编号'
        required: true
      source_platform:
        description: '平台：gitcode / github'
        required: false
        default: 'gitcode'
  repository_dispatch:
    types: [run-ci-fix-phase]

# 同一个 PR 的修复串行执行，避免并发冲突
# workflow_dispatch 没有 client_payload，需回退到 inputs，否则手动触发会求值成
# `ci-fix--` 而与其他手动触发挤在同一个组里排队，且与它自身 dispatch 出去的运行
# （组名按 PR 号）分属两组，串行保护失效。
concurrency:
  group: ci-fix-${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}-${{ github.event.client_payload.pr_number || github.event.inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  AI_RUNNER: ${{ vars.AI_RUNNER || 'opencode' }}
  GITCODE_FORK_REPO: ${{ vars.GITCODE_FORK_REPO || '' }}
  # 自动修复连续失败时是否回帖通知 PR。默认 false：回帖是 outward-facing 动作，
  # 且落在源仓库（别人的仓库）上，不该是自动链路的默认行为——失败信号由 job
  # 失败本身 + ci-fix-log 分支产物承载已足够。需要人工通知时设为 true。
  PR_COMMENT_ON_FAILURE: ${{ vars.PR_COMMENT_ON_FAILURE || '' }}
  # AI_MODEL: opencode 时填模型名如 deepseek/deepseek-v4-pro；
  #           claude-code-account 时填 claude-sonnet-4-6
  AI_MODEL: ${{ vars.AI_MODEL || 'deepseek/deepseek-v4-pro' }}
  AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '1800000' }}
  # 凭证：优先取 AI_API_KEY，未配置时复用本仓既有的 DEEPSEEK_API_KEY
  OPENAI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  DEEPSEEK_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  # 如需自定义 API 代理地址，在 Variables 中添加 OPENAI_BASE_URL
  OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || '' }}

jobs:

  # ── 手动触发入口（workflow_dispatch）─────────────────────────────
  manual-trigger:
    name: Manual trigger
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    env:
      SOURCE_REPO: ${{ github.event.inputs.source_repo }}
      SOURCE_PLATFORM: ${{ github.event.inputs.source_platform }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Dispatch ci-log-analysis
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/watch/manual_trigger.py

  # ── 阶段 1: CI 日志分析 ──────────────────────────────────────────
  ci-log-analysis:
    name: CI log analysis
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    if: |
      github.event.action == 'run-ci-fix-phase' &&
      github.event.client_payload.phase == 'ci-log-analysis'
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      SOURCE_PLATFORM: ${{ github.event.client_payload.source_platform || 'github' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PR_TITLE: ${{ github.event.client_payload.pr_title }}
      HEAD_SHA: ${{ github.event.client_payload.head_sha }}
      FIX_BRANCH: ${{ github.event.client_payload.fix_branch }}
      PR_BASE_BRANCH: ${{ github.event.client_payload.pr_base_branch }}
      # 重试时为 fix PR 编号，首次为 0；ci-log-analysis 用它从 fix PR 评论中查最新 build URL
      FIX_PR_NUMBER: ${{ github.event.client_payload.fix_pr_number || '0' }}
      CHAIN_ID: ${{ github.event.client_payload.chain_id || '' }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Checkout source repo (GitHub)
        if: env.SOURCE_PLATFORM != 'gitcode'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 1
          path: source-repo

      - name: Checkout source repo (GitCode)
        if: env.SOURCE_PLATFORM == 'gitcode'
        run: |
          git clone --depth=1 \
            https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.SOURCE_REPO }}.git \
            source-repo

      - name: Set up runner environment
        id: tools
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Setup Claude Code account credentials
        if: env.AI_RUNNER == 'claude-code-account'
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.claude
          echo "$CLAUDE_CREDENTIALS_JSON" > ~/.claude/.credentials.json
          chmod 600 ~/.claude/.credentials.json

      # 默认后端 opencode 由锁定工具链承担（无需 Node）；
      # claude-code / claude-code-account 后端才需要 npm 安装 Claude Code CLI。
      # npm 缺失时只会得到一句 `npm: command not found`（exit 127），与 PATH
      # 配置错误、包安装失败等完全无法区分，这里提前给出可操作的提示。
      - name: Install Claude Code CLI (non-opencode backends)
        if: env.AI_RUNNER != 'opencode'
        run: |
          if ! command -v npm >/dev/null 2>&1; then
            echo "::error::AI_RUNNER=$AI_RUNNER 需要 Claude Code CLI，但未找到 npm。请在该 runner 上先安装 Node.js：sudo dnf install -y nodejs npm"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Load conventions
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/lib/discover_conventions.py source-repo source-conventions.md

      - name: Run CI 日志分析
        env:
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/stages/ci-log-analysis.py

      - name: Mark failed
        if: failure()
        run: echo "⚠️ ci-log-analysis failed, check workflow logs"

  # ── 阶段 2: 容器构建修复（arm64 首修 → amd64 续修）───────────────
  build-fix-arm64:
    name: Build fix (arm64)
    runs-on: [self-hosted, Linux, ARM64, oe-image-arm64]
    timeout-minutes: 240
    if: |
      github.event.action == 'run-ci-fix-phase' &&
      github.event.client_payload.phase == 'build-fix' &&
      github.event.client_payload.arch == 'arm64'
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      SOURCE_PLATFORM: ${{ github.event.client_payload.source_platform || 'github' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PR_TITLE: ${{ github.event.client_payload.pr_title }}
      PR_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha }}
      FIX_BRANCH: ${{ github.event.client_payload.fix_branch }}
      PR_BASE_BRANCH: ${{ github.event.client_payload.pr_base_branch }}
      ARCH: arm64
      MODE: build
      VERIFY_COUNT: ${{ github.event.client_payload.verify_count || '0' }}
      CHAIN_ID: ${{ github.event.client_payload.chain_id || '' }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Checkout source repo (GitHub)
        if: env.SOURCE_PLATFORM != 'gitcode'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 0
          path: source-repo

      - name: Checkout source repo (GitCode)
        if: env.SOURCE_PLATFORM == 'gitcode'
        run: |
          git clone \
            https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.SOURCE_REPO }}.git \
            source-repo

      - name: Checkout PR head
        run: |
          cd source-repo
          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            git fetch origin refs/merge-requests/${{ env.PR_NUMBER }}/head:pr-head 2>/dev/null || \
              git fetch origin ${{ env.PR_HEAD_SHA }} 2>/dev/null || true
            git checkout pr-head 2>/dev/null || git checkout ${{ env.PR_HEAD_SHA }}
          else
            git fetch origin pull/${{ env.PR_NUMBER }}/head
            git checkout FETCH_HEAD
          fi

      # 容器修复阶段需要 Docker/buildx 与锁定工具链（opencode），由本仓既有的
      # phase1-setup 统一准备：创建 phase1-venv、落地锁定工具、执行原生 Runner 自检。
      - name: Set up toolchain and runner environment
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: aarch64
          preflight: "true"

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Setup Claude Code account credentials
        if: env.AI_RUNNER == 'claude-code-account'
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.claude
          echo "$CLAUDE_CREDENTIALS_JSON" > ~/.claude/.credentials.json
          chmod 600 ~/.claude/.credentials.json

      - name: Install Claude Code CLI (non-opencode backends)
        if: env.AI_RUNNER != 'opencode'
        run: |
          if ! command -v npm >/dev/null 2>&1; then
            echo "::error::AI_RUNNER=$AI_RUNNER 需要 Claude Code CLI，但未找到 npm。请在该 runner 上先安装 Node.js：sudo dnf install -y nodejs npm"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Load conventions
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/lib/discover_conventions.py source-repo source-conventions.md

      - name: Run 容器构建修复
        env:
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/stages/build-fix.py

      - name: Mark failed
        if: failure()
        run: echo "⚠️ build-fix-arm64 (${{ env.ARCH }}) failed, check workflow logs"

  build-fix-amd64:
    name: Build fix (amd64)
    # 注册 runner 时 x86_64 的自动标签是 X64（不是 AMD64），写错会一直 pending 到超时
    runs-on: [self-hosted, Linux, X64, oe-image-x86]
    timeout-minutes: 240
    if: |
      github.event.action == 'run-ci-fix-phase' &&
      github.event.client_payload.phase == 'build-fix' &&
      github.event.client_payload.arch == 'amd64'
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      SOURCE_PLATFORM: ${{ github.event.client_payload.source_platform || 'github' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PR_TITLE: ${{ github.event.client_payload.pr_title }}
      PR_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha }}
      FIX_BRANCH: ${{ github.event.client_payload.fix_branch }}
      PR_BASE_BRANCH: ${{ github.event.client_payload.pr_base_branch }}
      ARCH: amd64
      MODE: build
      VERIFY_COUNT: ${{ github.event.client_payload.verify_count || '0' }}
      CHAIN_ID: ${{ github.event.client_payload.chain_id || '' }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Checkout source repo (GitHub)
        if: env.SOURCE_PLATFORM != 'gitcode'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 0
          path: source-repo

      - name: Checkout source repo (GitCode)
        if: env.SOURCE_PLATFORM == 'gitcode'
        run: |
          git clone \
            https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.SOURCE_REPO }}.git \
            source-repo

      - name: Checkout PR head
        run: |
          cd source-repo
          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            git fetch origin refs/merge-requests/${{ env.PR_NUMBER }}/head:pr-head 2>/dev/null || \
              git fetch origin ${{ env.PR_HEAD_SHA }} 2>/dev/null || true
            git checkout pr-head 2>/dev/null || git checkout ${{ env.PR_HEAD_SHA }}
          else
            git fetch origin pull/${{ env.PR_NUMBER }}/head
            git checkout FETCH_HEAD
          fi

      - name: Set up toolchain and runner environment
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: x86_64
          preflight: "true"

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Setup Claude Code account credentials
        if: env.AI_RUNNER == 'claude-code-account'
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.claude
          echo "$CLAUDE_CREDENTIALS_JSON" > ~/.claude/.credentials.json
          chmod 600 ~/.claude/.credentials.json

      - name: Install Claude Code CLI (non-opencode backends)
        if: env.AI_RUNNER != 'opencode'
        run: |
          if ! command -v npm >/dev/null 2>&1; then
            echo "::error::AI_RUNNER=$AI_RUNNER 需要 Claude Code CLI，但未找到 npm。请在该 runner 上先安装 Node.js：sudo dnf install -y nodejs npm"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Load conventions
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/lib/discover_conventions.py source-repo source-conventions.md

      - name: Run 容器构建修复
        env:
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/stages/build-fix.py

      - name: Mark failed
        if: failure()
        run: echo "⚠️ build-fix-amd64 (${{ env.ARCH }}) failed, check workflow logs"

  # ── 阶段 3: arm64 复验（确定性 docker build，无 AI）──────────────
  verify-arm:
    name: Verify arm64 build
    runs-on: [self-hosted, Linux, ARM64, oe-image-arm64]
    # 这是唯一一次权威的「从零 docker build」，且无 AI 可退让，因此它才是重型镜像
    # （如 milvus：源码编译 conan 依赖 + C++ 核心）的真实瓶颈。120 分钟对小时级
    # 冷构建必然不够——那种情况下 job 会被砍在构建中途，而 derived Dockerfile 本身
    # 没问题，属于「预算不足」而非「修复失败」，白白浪费前面的 AI 攻坚。
    timeout-minutes: 300
    if: |
      github.event.action == 'run-ci-fix-phase' &&
      github.event.client_payload.phase == 'verify-arm'
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      SOURCE_PLATFORM: ${{ github.event.client_payload.source_platform || 'github' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PR_TITLE: ${{ github.event.client_payload.pr_title }}
      PR_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha }}
      FIX_BRANCH: ${{ github.event.client_payload.fix_branch }}
      PR_BASE_BRANCH: ${{ github.event.client_payload.pr_base_branch }}
      ARCH: arm64
      MODE: verify
      VERIFY_COUNT: ${{ github.event.client_payload.verify_count || '0' }}
      CHAIN_ID: ${{ github.event.client_payload.chain_id || '' }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Checkout source repo (GitHub)
        if: env.SOURCE_PLATFORM != 'gitcode'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 0
          path: source-repo

      - name: Checkout source repo (GitCode)
        if: env.SOURCE_PLATFORM == 'gitcode'
        run: |
          git clone \
            https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.SOURCE_REPO }}.git \
            source-repo

      - name: Checkout PR head
        run: |
          cd source-repo
          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            git fetch origin refs/merge-requests/${{ env.PR_NUMBER }}/head:pr-head 2>/dev/null || \
              git fetch origin ${{ env.PR_HEAD_SHA }} 2>/dev/null || true
            git checkout pr-head 2>/dev/null || git checkout ${{ env.PR_HEAD_SHA }}
          else
            git fetch origin pull/${{ env.PR_NUMBER }}/head
            git checkout FETCH_HEAD
          fi

      - name: Set up toolchain and runner environment
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: aarch64
          preflight: "true"

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Run arm64 复验
        env:
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/stages/build-fix.py

      - name: Mark failed
        if: failure()
        run: echo "⚠️ verify-arm failed, check workflow logs"

  # ── 阶段 4: 应用修复 ────────────────────────────────────────────
  code-fix:
    name: Apply fix and open PR
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    if: |
      github.event.action == 'run-ci-fix-phase' &&
      github.event.client_payload.phase == 'code-fix'
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      SOURCE_PLATFORM: ${{ github.event.client_payload.source_platform || 'github' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PR_TITLE: ${{ github.event.client_payload.pr_title }}
      PR_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha }}
      FIX_BRANCH: ${{ github.event.client_payload.fix_branch }}
      PR_BASE_BRANCH: ${{ github.event.client_payload.pr_base_branch }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      # Variable `GITCODE_FORK_REPO` 实际被填成了完整 URL
      # （https://gitcode.com/m0_46560176/openeuler-docker-images），而本 job 里
      # 三处消费点（git remote add fork、git remote set-url、Fix PR head）都按
      # `owner/repo` 拼接，会拼出 `gitcode.com/https://gitcode.com/m0_....git`
      # 和 head `https::fix/4723`。与其要求配置方记住格式，不如消费侧先归一。
      - name: Normalize GITCODE_FORK_REPO
        if: env.SOURCE_PLATFORM == 'gitcode'
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" - <<'EOF' >> "$GITHUB_ENV"
          import os, sys
          sys.path.insert(0, '.')
          from scripts.lib.stage_common import normalize_repo
          print(f"GITCODE_FORK_REPO={normalize_repo(os.environ.get('GITCODE_FORK_REPO', ''))}")
          EOF

      - name: Checkout source repo (GitHub)
        if: env.SOURCE_PLATFORM != 'gitcode'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 0
          path: source-repo

      - name: Checkout source repo (GitCode)
        if: env.SOURCE_PLATFORM == 'gitcode'
        run: |
          git clone \
            https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.SOURCE_REPO }}.git \
            source-repo

      - name: Setup fix branch
        run: |
          cd source-repo
          git config user.name "${{ vars.GIT_COMMIT_NAME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.GIT_COMMIT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            # GitCode: 直接 fetch PR head ref
            git fetch origin refs/merge-requests/${{ env.PR_NUMBER }}/head:pr-head 2>/dev/null || \
              git fetch origin ${{ env.PR_HEAD_SHA }} 2>/dev/null || true

            # fix 分支推送到 fork，需要用 fork remote 检查；若未配置 fork 则退回 origin
            FORK_REPO="${GITCODE_FORK_REPO:-}"
            if [ -n "$FORK_REPO" ] && [ "$FORK_REPO" != "$SOURCE_REPO" ]; then
              git remote add fork \
                https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${FORK_REPO}.git
              FIX_BRANCH_REMOTE="fork"
            else
              FIX_BRANCH_REMOTE="origin"
            fi
          else
            git fetch origin pull/${{ env.PR_NUMBER }}/head
            FIX_BRANCH_REMOTE="origin"
          fi

          if git ls-remote --exit-code --heads $FIX_BRANCH_REMOTE ${{ env.FIX_BRANCH }}; then
            git fetch $FIX_BRANCH_REMOTE ${{ env.FIX_BRANCH }}
            git checkout -b ${{ env.FIX_BRANCH }} $FIX_BRANCH_REMOTE/${{ env.FIX_BRANCH }}
          else
            git checkout ${{ env.PR_HEAD_SHA }} 2>/dev/null || git checkout FETCH_HEAD
            git checkout -b ${{ env.FIX_BRANCH }}
          fi

      - name: Run 应用修复
        id: code_fix
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/stages/code-fix.py

      - name: Remove AI artifacts from fix branch
        if: steps.code_fix.outputs.no_changes != 'true'
        run: |
          cd source-repo
          for pattern in ".claude" ".opencode" "__pycache__" ".aider" ".agents"; do
            find . -name "$pattern" -not -path "./.git/*" | while read p; do
              git rm -rf --cached "$p" 2>/dev/null || true
              rm -rf "$p"
            done
          done
          find . -name "*.pyc" -o -name "*.pyo" | grep -v ".git" | while read p; do
            git rm -f --cached "$p" 2>/dev/null || true
            rm -f "$p"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove AI-generated artifacts"
          fi

      - name: Push fix branch
        if: steps.code_fix.outputs.no_changes != 'true'
        run: |
          cd source-repo
          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            PUSH_REPO="${GITCODE_FORK_REPO:-$SOURCE_REPO}"
            git remote set-url origin \
              https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${PUSH_REPO}.git
          else
            git remote set-url origin \
              https://x-access-token:${{ secrets.DISPATCH_TOKEN }}@github.com/${{ env.SOURCE_REPO }}.git
          fi
          git push origin "+refs/heads/${{ env.FIX_BRANCH }}:refs/heads/${{ env.FIX_BRANCH }}"

      - name: Create fix PR if not exists
        if: steps.code_fix.outputs.no_changes != 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            "${RUNNER_TEMP}/phase1-venv/bin/python" - <<'EOF'
          import os, sys
          sys.path.insert(0, '.')
          from scripts.lib.ci_gitcode_api import find_any_pr_by_head_branch, create_pull_request
          from scripts.lib.fix_pr_body import build

          repo      = os.environ['SOURCE_REPO']
          fork_repo = os.environ.get('GITCODE_FORK_REPO', '').strip() or repo
          token     = os.environ['GITCODE_TOKEN']
          fix_br    = os.environ['FIX_BRANCH']
          base_br   = os.environ['PR_BASE_BRANCH']
          meta      = build(int(os.environ['PR_NUMBER']), os.environ['PR_TITLE'])

          head = f"{fork_repo.split('/')[0]}:{fix_br}" if fork_repo != repo else fix_br
          existing = find_any_pr_by_head_branch(repo, fix_br, token, open_only=True)
          if not existing:
              try:
                  create_pull_request(repo, head, base_br, meta['title'], meta['body'], token)
                  print(f"✅ Fix PR created: {meta['title']}")
              except Exception as e:
                  if 'already exists' in str(e).lower() or '422' in str(e):
                      print("✅ Fix PR already exists (detected on create), new commit pushed")
                  else:
                      raise
          else:
              print(f"✅ Fix PR already exists (#{existing['number']}), new commit pushed")
          EOF
          else
            PR_EXISTS=$(gh pr list \
              --repo ${{ env.SOURCE_REPO }} \
              --head ${{ env.FIX_BRANCH }} \
              --state open \
              --json number \
              -q '.[0].number' 2>/dev/null || echo "")
            if [ -z "$PR_EXISTS" ]; then
              "${RUNNER_TEMP}/phase1-venv/bin/python" - <<'PYEOF'
          import os, sys, subprocess
          sys.path.insert(0, '.')
          from scripts.lib.fix_pr_body import build

          meta = build(int(os.environ['PR_NUMBER']), os.environ['PR_TITLE'])
          subprocess.run([
              'gh', 'pr', 'create',
              '--repo', os.environ['SOURCE_REPO'],
              '--title', meta['title'],
              '--body',  meta['body'],
              '--head',  os.environ['FIX_BRANCH'],
              '--base',  os.environ['PR_BASE_BRANCH'],
          ], check=True)
          print(f"✅ Fix PR created: {meta['title']}")
          PYEOF
            else
              echo "✅ Fix PR #$PR_EXISTS already exists, new commit pushed"
            fi
          fi

      - name: Mark failed
        if: failure()
        run: echo "⚠️ code-fix failed, check workflow logs"