name: App Version Upgrade

# 场景二：应用自动升级（替代社区 easysoftware-autoupgrade）。
#
#   版本号以 Issue / 手动输入的 version 为准；config/upgrade-apps.yml 只负责
#   app → 仓库映射，缺失时才用手动兜底字段（version / source_url / 可选 tag）。
#   同时对比两个目标仓：
#     - openeuler/openeuler-docker-images：缺新版本 → 补测试 + AI 生成
#       Dockerfile + 双架构原生验证 + 跨仓 PR；版本目录已存在 → audit 修复；
#     - openeuler/conda-ecopkgs：supported-versions.yml 未登记 → 追加版本并开 PR。
#   清单里同一个软件两个仓都有时两边都会升级；只有一边存在时只升级那一边。
#
# 自动升级不查询外部版本服务；Issue 驱动时版本与上游证据都来自 Issue，
# 手动触发时必须显式给 version（或由清单兜底）。两者都缺时跳过并记录原因；没有
# Issue 证据时才回落到 source=manual 的最小证据。
#
# 触发：workflow_dispatch（手动 / Issue 驱动）。Issue 正文必须携带完整上游证据
# JSON；upgrade-issue-watch 会传入 app / version / os_version / evidence /
# source_issue，扫描阶段优先使用该证据。手动入口用 app 指定单个应用、version
# 指定目标版本，不携带证据时回落到 manual 证据。
#
# 自动 repair：本轮任一应用的双架构验证失败时，plan-repairs 从 jobs 列表里挑出
# 验证失败的 app，自动调用 _upgrade_app.yml 的 repair 模式修复已有分支并重新
# 验证一次；只修一轮，失败就停（prepare 失败不修，因为没有分支）。

on:
  workflow_dispatch:
    inputs:
      app:
        description: '只升级这些应用（逗号分隔可多个；留空 = 全量扫描）'
        required: false
        type: string
      version:
        description: '手动指定目标版本（配合 app 使用；清单项也可各自配置 version）'
        required: false
        type: string
      tag:
        description: '手动指定版本对应的上游 tag（如 slurm-26-05-6-1；留空则不校验 tag）'
        required: false
        type: string
      source_url:
        description: '手动指定版本的上游仓库 HTTPS 地址（配合 version；用于 task spec）'
        required: false
        type: string
      source_issue:
        description: '来源 GitCode Issue 编号（由 upgrade-issue-watch 自动填写；手动触发留空）'
        required: false
        type: string
      evidence:
        description: 'Issue 正文提供的上游证据 JSON（由 upgrade-issue-watch 自动填写；手动触发留空）'
        required: false
        type: string
      os_version:
        description: '目标 openEuler 版本（Issue 触发时用于 conda 登记；留空则用各包最新段）'
        required: false
        type: string
      apps_file:
        description: '本轮使用的软件清单路径（留空 = config/upgrade-apps.yml）'
        required: false
        type: string
      limit:
        description: '本轮最多升级几个应用（0 = 不限）'
        required: false
        default: '0'
        type: string
      audit_limit:
        description: '本轮最多审计几个「已是最新版本」的应用（0 = 不限）'
        required: false
        default: '0'
        type: string
      runner_labels:
        description: '轻量 job 的 runner 标签（JSON 数组），留空用 Variable / 默认值'
        required: false
        type: string
      x64_runner_labels:
        description: 'x86_64 构建/验证 runner 标签（JSON 数组）；留空用 Variable / 默认全部 X64'
        required: false
        type: string
      arm64_runner_labels:
        description: 'aarch64 构建/验证 runner 标签（JSON 数组）；留空用 Variable / 默认全部 ARM64'
        required: false
        type: string
      max_parallel:
        description: '单轮最多并发几个应用；留空用 Variable MAX_PARALLEL_UPGRADES / 默认 4'
        required: false
        type: string

permissions:
  # plan-repairs 需要读取本次运行的 jobs，判断哪些应用在验证阶段失败；
  # create-image 需要用 gh workflow run 触发场景一；
  # app 子链路要把 Agent 总结的 app-note 推回本仓并开 notes PR。
  actions: write
  contents: write
  pull-requests: write

env:
  PYTHONUNBUFFERED: "1"
  TARGET_REPO: openeuler/openeuler-docker-images
  TARGET_BRANCH: master

concurrency:
  # 按 app 隔离：Issue 逐 app 派发时不同应用可并行，同一应用串行避免双开；
  # 批量扫描（app 为空）仍按 ref 串行。固定 group 会导致排队 run 互相顶掉丢请求。
  group: app-version-upgrade-${{ inputs.app || github.ref }}
  cancel-in-progress: false

jobs:

  # ── 发现：清单版本 + 本地版本对比 → 升级矩阵 ─────────────────────
  discover:
    name: Discover upgradable apps
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.UPGRADE_NEUTRAL_RUNNER_LABELS ||
          '["self-hosted","Linux","oe-any"]') }}
    timeout-minutes: 60
    outputs:
      updates: ${{ steps.scan.outputs.updates }}
      audits: ${{ steps.scan.outputs.audits }}
      conda_updates: ${{ steps.scan.outputs.conda_updates }}
      new_images: ${{ steps.scan.outputs.new_images }}
      skipped: ${{ steps.scan.outputs.skipped }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Clone target repository
        uses: ./.github/actions/clone-retry
        with:
          url: "https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.TARGET_REPO }}.git"
          destination: source-repo
          depth: "1"

      - name: Clone conda repository
        uses: ./.github/actions/clone-retry
        with:
          url: "https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/openeuler/conda-ecopkgs.git"
          destination: conda-repo
          depth: "1"

      - name: Scan app list vs target repos
        id: scan
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          SOURCE_REPO_DIR: ${{ github.workspace }}/source-repo
          CONDA_REPO_DIR: ${{ github.workspace }}/conda-repo
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          SOURCE_URL: ${{ inputs.source_url }}
          OS_VERSION: ${{ inputs.os_version }}
          EVIDENCE: ${{ inputs.evidence }}
          APPS_FILE: ${{ inputs.apps_file }}
          LIMIT: ${{ inputs.limit || '0' }}
          AUDIT_LIMIT: ${{ inputs.audit_limit || '0' }}
        run: |
          ARGS=(--repo "$SOURCE_REPO_DIR" --conda-repo "$CONDA_REPO_DIR"
                --format github-output --limit "${LIMIT:-0}"
                --audit-limit "${AUDIT_LIMIT:-0}")
          if [ -n "$APP" ]; then
            ARGS+=(--app "$APP")
          fi
          if [ -n "$VERSION" ]; then
            ARGS+=(--version "$VERSION")
          fi
          if [ -n "$TAG" ]; then
            ARGS+=(--tag "$TAG")
          fi
          if [ -n "$SOURCE_URL" ]; then
            ARGS+=(--source-url "$SOURCE_URL")
          fi
          if [ -n "$OS_VERSION" ]; then
            ARGS+=(--os-version "$OS_VERSION")
          fi
          if [ -n "$EVIDENCE" ]; then
            ARGS+=(--evidence "$EVIDENCE")
          fi
          if [ -n "$APPS_FILE" ]; then
            ARGS+=(--apps-file "$APPS_FILE")
          fi
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/upgrade_scan.py \
            "${ARGS[@]}"

  # ── 升级：一应用一 PR（独立的可复用 workflow，互不影响）────────────
  upgrade:
    name: "Upgrade ${{ matrix.item.app }}"
    needs: discover
    if: needs.discover.outputs.updates != '[]' && needs.discover.outputs.updates != ''
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || vars.MAX_PARALLEL_UPGRADES || '4') }}
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.updates) }}
    uses: ./.github/workflows/_upgrade_app.yml
    secrets: inherit
    with:
      item: ${{ toJSON(matrix.item) }}
      app: ${{ matrix.item.app }}
      domain: ${{ matrix.item.domain }}
      version: ${{ matrix.item.version }}
      os_version: ${{ matrix.item.os_version }}
      source_url: ${{ matrix.item.source_url }}
      x64_runner_labels: >-
        ${{ inputs.x64_runner_labels || vars.UPGRADE_X64_RUNNER_LABELS ||
            '["self-hosted","Linux","X64","oe-upgrade-x64"]' }}
      arm64_runner_labels: >-
        ${{ inputs.arm64_runner_labels || vars.UPGRADE_ARM64_RUNNER_LABELS ||
            '["self-hosted","Linux","ARM64","oe-upgrade-arm64"]' }}
      neutral_runner_labels: >-
        ${{ inputs.runner_labels || vars.UPGRADE_NEUTRAL_RUNNER_LABELS ||
            '["self-hosted","Linux","oe-any"]' }}
      build_timeout_minutes: ${{ matrix.item.build_timeout_minutes || '180' }}
      prepare_timeout_minutes: ${{ matrix.item.prepare_timeout_minutes || '240' }}

  # ── conda：把新版本登记到 conda-ecopkgs（一包一 PR）───────────────
  conda-upgrade:
    name: Register conda packages
    needs: discover
    if: >-
      needs.discover.outputs.conda_updates != '[]' &&
      needs.discover.outputs.conda_updates != ''
    uses: ./.github/workflows/conda_ecopkgs_pr.yml
    secrets: inherit
    with:
      items: ${{ needs.discover.outputs.conda_updates }}
      runner_arch: any

  # ── 新建：两库都没有的软件，调用场景一先建镜像 ───────────────────
  create-image:
    name: "Create ${{ matrix.item.app }} image"
    needs: discover
    if: >-
      needs.discover.outputs.new_images != '[]' &&
      needs.discover.outputs.new_images != ''
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || vars.MAX_PARALLEL_UPGRADES || '4') }}
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.new_images) }}
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.UPGRADE_RUNNER_LABELS ||
          '["self-hosted","Linux","X64","oe-image-x86"]') }}
    timeout-minutes: 10
    steps:
      - name: Dispatch Create New Images
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.item.app }}
          VERSION: ${{ matrix.item.version }}
          OS_VERSION: ${{ matrix.item.os_version }}
          DOMAIN: ${{ matrix.item.domain }}
          SOURCE_URL: ${{ matrix.item.source_url }}
        run: |
          gh workflow run create_new_images.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f operation=scenario_one \
            -f app="${APP}" \
            -f version="${VERSION}" \
            -f os_version="${OS_VERSION}" \
            -f domain="${DOMAIN}" \
            -f source_url="${SOURCE_URL}"

  # ── 自动修复：只挑验证失败的应用，在原分支上修一轮 ─────────────────
  plan-repairs:
    name: Plan automatic repairs
    needs: [discover, upgrade]
    if: >-
      ${{ always() && needs.upgrade.result == 'failure' &&
          vars.AUTO_REPAIR_UPGRADES != 'false' }}
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.UPGRADE_NEUTRAL_RUNNER_LABELS ||
          '["self-hosted","Linux","oe-any"]') }}
    timeout-minutes: 15
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Select apps whose validation failed
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REPAIR_INSTRUCTIONS: ${{ vars.UPGRADE_REPAIR_INSTRUCTIONS }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/harness/upgrade_plan_repairs.py \
            --repo "$REPO" \
            --run-id "$RUN_ID" \
            --instructions "$REPAIR_INSTRUCTIONS"

  repair:
    name: "Auto repair ${{ matrix.app }}"
    needs: [upgrade, plan-repairs]
    if: >-
      ${{ always() && needs.plan-repairs.outputs.count != '0' &&
          needs.plan-repairs.outputs.count != '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || vars.MAX_PARALLEL_UPGRADES || '4') }}
      matrix: ${{ fromJSON(needs.plan-repairs.outputs.matrix) }}
    uses: ./.github/workflows/_upgrade_app.yml
    secrets: inherit
    with:
      item: ''
      app: ${{ matrix.app }}
      repair_run_id: ${{ github.run_id }}
      repair_instructions: ${{ matrix.instructions }}
      x64_runner_labels: >-
        ${{ inputs.x64_runner_labels || vars.UPGRADE_X64_RUNNER_LABELS ||
            '["self-hosted","Linux","X64","oe-upgrade-x64"]' }}
      arm64_runner_labels: >-
        ${{ inputs.arm64_runner_labels || vars.UPGRADE_ARM64_RUNNER_LABELS ||
            '["self-hosted","Linux","ARM64","oe-upgrade-arm64"]' }}
      neutral_runner_labels: >-
        ${{ inputs.runner_labels || vars.UPGRADE_NEUTRAL_RUNNER_LABELS ||
            '["self-hosted","Linux","oe-any"]' }}
      build_timeout_minutes: ${{ matrix.build_timeout_minutes || '180' }}
      prepare_timeout_minutes: ${{ matrix.prepare_timeout_minutes || '240' }}

  # ── 审计并修复：已是最新版本也不跳过，AI 检查后提 PR ──────────────
  audit:
    name: "Audit and fix ${{ matrix.item.app }}"
    needs: discover
    if: needs.discover.outputs.audits != '[]' && needs.discover.outputs.audits != ''
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || vars.MAX_PARALLEL_UPGRADES || '4') }}
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.audits) }}
    uses: ./.github/workflows/_audit_app.yml
    secrets: inherit
    with:
      item: ${{ toJSON(matrix.item) }}
      app: ${{ matrix.item.app }}
      domain: ${{ matrix.item.domain }}
      version: ${{ matrix.item.version }}
      os_version: ${{ matrix.item.os_version }}
      runner_labels: >-
        ${{ inputs.runner_labels || vars.UPGRADE_NEUTRAL_RUNNER_LABELS ||
            '["self-hosted","Linux","oe-any"]' }}
      x64_runner_labels: >-
        ${{ inputs.x64_runner_labels || vars.UPGRADE_X64_RUNNER_LABELS ||
            '["self-hosted","Linux","X64","oe-upgrade-x64"]' }}
      arm64_runner_labels: >-
        ${{ inputs.arm64_runner_labels || vars.UPGRADE_ARM64_RUNNER_LABELS ||
            '["self-hosted","Linux","ARM64","oe-upgrade-arm64"]' }}
      build_timeout_minutes: ${{ matrix.item.build_timeout_minutes || '180' }}
      prepare_timeout_minutes: ${{ matrix.item.prepare_timeout_minutes || '240' }}

  # ── 汇总：本轮跳过原因（含 blocked_reason / 已有 PR / 审计上限）─────
  summary:
    name: Summarize round
    needs: [discover, upgrade, conda-upgrade, create-image, plan-repairs, repair, audit]
    if: ${{ always() }}
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.UPGRADE_NEUTRAL_RUNNER_LABELS ||
          '["self-hosted","Linux","oe-any"]') }}
    steps:
      - name: Write summary
        env:
          SKIPPED: ${{ needs.discover.outputs.skipped }}
          CONDA_UPDATES: ${{ needs.discover.outputs.conda_updates }}
          NEW_IMAGES: ${{ needs.discover.outputs.new_images }}
        run: |
          {
            echo "## 应用自动升级"
            echo ""
            echo "- 升级任务结果：\`${{ needs.upgrade.result || 'skipped' }}\`"
            echo "- conda 登记结果：\`${{ needs.conda-upgrade.result || 'skipped' }}\`"
            echo "- 新建镜像结果：\`${{ needs.create-image.result || 'skipped' }}\`"
            echo "- 自动修复任务结果：\`${{ needs.repair.result || 'skipped' }}\`"
            echo "- 审计/修复任务结果：\`${{ needs.audit.result || 'skipped' }}\`"
            echo "- 待新建镜像："
            echo ""
            echo '```json'
            echo "${NEW_IMAGES:-[]}"
            echo '```'
            echo "- conda 待登记："
            echo ""
            echo '```json'
            echo "${CONDA_UPDATES:-[]}"
            echo '```'
            echo "- 跳过明细："
            echo ""
            echo '```json'
            echo "${SKIPPED:-[]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 回写：把本轮结果写回来源 GitCode Issue（仅 Issue 触发时）────────
  finalize-issue:
    name: Finalize source Issue
    needs: [discover, upgrade, conda-upgrade, create-image, plan-repairs, repair, audit]
    if: ${{ always() && inputs.source_issue != '' }}
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.UPGRADE_NEUTRAL_RUNNER_LABELS ||
          '["self-hosted","Linux","oe-any"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute outcome
        id: outcome
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
          CONDA_RESULT: ${{ needs.conda-upgrade.result }}
          CREATE_RESULT: ${{ needs.create-image.result }}
          REPAIR_RESULT: ${{ needs.repair.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          outcome=success
          for result in \
            "${DISCOVER_RESULT}" \
            "${UPGRADE_RESULT}" \
            "${CONDA_RESULT}" \
            "${CREATE_RESULT}" \
            "${REPAIR_RESULT}" \
            "${AUDIT_RESULT}"; do
            case "${result}" in
              failure|cancelled) outcome=failure ;;
            esac
          done
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"

      # 失败时把各失败 job 的关键日志行摘出来，回写评论时一并附上。
      - name: Collect failed job logs
        if: ${{ steps.outcome.outputs.outcome == 'failure' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/utils/collect_failed_logs.py \
            --output "${RUNNER_TEMP}/failure-log.md"

      - name: Write result back to source Issue
        env:
          GITCODE_ISSUE_TOKEN: ${{ secrets.GITCODE_ISSUE_TOKEN || secrets.GITCODE_TOKEN }}
          SOURCE_ISSUE: ${{ inputs.source_issue }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_LOG: ${{ runner.temp }}/failure-log.md
        run: |
          summary=""
          if [ -s "${FAILURE_LOG}" ]; then
            summary="$(cat "${FAILURE_LOG}")"
          fi
          python3 scripts/harness/flow.py upgrade-issue-finalize \
            --target-repo "${TARGET_REPO}" \
            --issue-number "${SOURCE_ISSUE}" \
            --outcome "${OUTCOME}" \
            --run-url "${RUN_URL}" \
            --failure-summary "${summary}"
