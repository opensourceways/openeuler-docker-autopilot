name: App Version Upgrade

# 场景二：应用自动升级（替代社区 easysoftware-autoupgrade）。
#
#   按 config/upgrade-apps.yml 清单调用 upstream-dashboard
#   /api/v1/version/resolve，拿到最新版本 + 上游证据包 → 与目标仓已有版本目录
#   对比 → 对缺新版本的应用执行「补功能测试 + 确定性版本升级 + 双架构原生验证
#   + 跨仓 PR」，一应用一 PR。
#
# 版本源只认看板接口（文档见 opensourceways/upstream-dashboard docs/external-api.md）。
# 证据包的归纳/透传见 scripts/lib/upstream_evidence.py，作为镜像构建与测试生成的
# 输入，证据缺失时系统自探兜底；是否通过仍以双架构原生构建 + 功能测试为准。
#
# 触发：当前只保留 workflow_dispatch（每日定时在测试期关闭）。
# 手动入口：app 指定单个应用；version 手动指定目标版本（跳过看板解析）。

on:
  workflow_dispatch:
    inputs:
      app:
        description: '只升级这一个应用（留空 = 全量扫描）'
        required: false
        type: string
      version:
        description: '手动指定目标版本（配合 app 使用；留空 = 用看板解析的最新版）'
        required: false
        type: string
      limit:
        description: '本轮最多升级几个应用（0 = 不限）'
        required: false
        default: '0'
        type: string
      runner_labels:
        description: '轻量 job 的 runner 标签（JSON 数组），留空用 Variable / 默认值'
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  TARGET_REPO: openeuler/openeuler-docker-images
  TARGET_BRANCH: master
  # 看板地址（可覆盖到其它部署）
  UPSTREAM_DASHBOARD_BASE: ${{ vars.UPSTREAM_DASHBOARD_BASE || 'https://upstream-dashboard.test.osinfra.cn' }}

concurrency:
  group: app-version-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── 发现：看板解析 + 本地版本对比 → 升级矩阵 ─────────────────────
  discover:
    name: Discover upgradable apps
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.UPGRADE_RUNNER_LABELS ||
          '["self-hosted","Linux","X64","oe-image-x86"]') }}
    timeout-minutes: 60
    outputs:
      updates: ${{ steps.scan.outputs.updates }}
      skipped: ${{ steps.scan.outputs.skipped }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Clone target repository
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${TARGET_REPO}.git" \
            source-repo

      - name: Scan dashboard vs target repo
        id: scan
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          SOURCE_REPO_DIR: ${{ github.workspace }}/source-repo
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          ARGS=(--repo "$SOURCE_REPO_DIR" --format github-output --limit "${LIMIT:-0}")
          if [ -n "$APP" ]; then
            ARGS+=(--app "$APP")
          fi
          if [ -n "$VERSION" ]; then
            ARGS+=(--version "$VERSION")
          fi
          SKIPPED=$(mktemp)
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/upgrade_scan.py \
            "${ARGS[@]}" > "$SKIPPED"
          {
            echo "skipped<<EOF"
            cat "$SKIPPED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── 升级：一应用一 PR（独立的可复用 workflow，互不影响）────────────
  upgrade:
    name: "Upgrade ${{ matrix.item.app }}"
    needs: discover
    if: needs.discover.outputs.updates != '[]' && needs.discover.outputs.updates != ''
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.MAX_PARALLEL_UPGRADES || 2 }}
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.updates) }}
    uses: ./.github/workflows/_upgrade_app.yml
    secrets: inherit
    with:
      item: ${{ toJSON(matrix.item) }}
      app: ${{ matrix.item.app }}
      domain: ${{ matrix.item.domain }}
      version: ${{ matrix.item.version }}
      os_version: ${{ matrix.item.os_version }}
      source_url: ${{ matrix.item.source_url }}

  # ── 汇总：本轮跳过原因（含 blocked_reason / 已有版本 / 已有 PR）─────
  summary:
    name: Summarize round
    needs: [discover, upgrade]
    if: ${{ always() }}
    runs-on: >-
      ${{ fromJSON(inputs.runner_labels || vars.UPGRADE_RUNNER_LABELS ||
          '["self-hosted","Linux","X64","oe-image-x86"]') }}
    steps:
      - name: Write summary
        env:
          SKIPPED: ${{ needs.discover.outputs.skipped }}
        run: |
          {
            echo "## 应用自动升级"
            echo ""
            echo "- 升级任务结果：\`${{ needs.upgrade.result || 'skipped' }}\`"
            echo "- 跳过明细："
            echo ""
            echo '```json'
            echo "${SKIPPED:-[]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
