name: CI repair (reusable)

# 公共组件：一次 PR CI 失败修复 = 一个 run，全程串行可读（仿 create_new_images.yml）：
#
#   prepare → analyze → round-1 → [round-2] → [round-3] → code-fix
#
# 每一轮修复都是 Actions 里一个显式 job（Round N: fix/verify），复验失败会自动开
# 下一轮、轮次和预算一眼可见。
#
# 只保留**手动 / 显式调用**：入口是 ci_fix_pipeline.yml（workflow_dispatch /
# repository_dispatch）；Monitor 的 cron 自动轮询已下线，跨周期重试预算由调用方
# 通过 attempt / fix_pr_number 传入。

on:
  workflow_call:
    inputs:
      source_repo:
        description: '目标仓库（owner/repo，如 openeuler/openeuler-docker-images）'
        required: true
        type: string
      pr_number:
        description: 'PR 编号'
        required: true
        type: string
      source_platform:
        description: '平台：gitcode / github'
        required: false
        type: string
        default: 'gitcode'
      fix_pr_number:
        description: '重试时的 Fix PR 编号（首次为 0）'
        required: false
        type: string
        default: '0'
      attempt:
        description: '第几次修复（写进日志与产物）'
        required: false
        type: string
        default: '1'
      # 三类 job 的 runner 标签都可覆盖（JSON 数组，留空则用 Variable / 默认值）。
      # 架构相关的 job 只能换"哪台 arm64/x64 机器"，不能换架构——复验就是双架构保证本身。
      # 轻量 job 默认也走自托管 X64 Runner：本仓库所在账号的 GitHub 托管 Runner 额度不可用
      # （ubuntu-latest 会在 prepare 阶段直接失败），自托管是当前唯一可跑通的选择。
      x64_runner_labels:
        description: 'prepare / 分析 / code-fix 的 runner 标签，JSON 数组'
        required: false
        type: string
        default: '["self-hosted","Linux","X64","oe-image-x86"]'
      amd64_runner_labels:
        description: 'amd64 修复 job 的 runner 标签（需 Docker + ≥4 CPU），JSON 数组'
        required: false
        type: string
        default: '["self-hosted","Linux","X64","oe-fix-amd64"]'
      arm64_runner_labels:
        description: 'arm64 修复/复验 job 的 runner 标签（必须 arm64），JSON 数组'
        required: false
        type: string
        default: '["self-hosted","Linux","ARM64","oe-fix-arm64"]'
    secrets:
      DISPATCH_TOKEN:
        required: false
      GITCODE_TOKEN:
        required: false
      AI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      CLAUDE_CREDENTIALS_JSON:
        required: false

# 同一个 PR 的修复串行执行，避免并发冲突。
# 注意：`concurrency` 不能写在可复用工作流的顶层（GitHub 会判为非法工作流文件，
# workflow_dispatch 直接失败且不产生任何 job）；串行控制由入口
# ci_fix_pipeline.yml 的 workflow 级 concurrency 承担。

permissions:
  # ci-fix-log 数据分支的读写走本仓库 token；未配置 DISPATCH_TOKEN 时脚本回退到它
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  AI_RUNNER: ${{ vars.AI_RUNNER || 'opencode' }}
  GITCODE_FORK_REPO: ${{ vars.GITCODE_FORK_REPO || '' }}
  # 自动修复连续失败时是否回帖通知 PR。默认 false：回帖是 outward-facing 动作，
  # 且落在源仓库（别人的仓库）上，不该是自动链路的默认行为——失败信号由 job
  # 失败本身 + ci-fix-log 分支产物承载已足够。需要人工通知时设为 true。
  PR_COMMENT_ON_FAILURE: ${{ vars.PR_COMMENT_ON_FAILURE || '' }}
  # AI_MODEL: opencode 的模型名，写成 `provider/model`。
  #           当前服务商为火山引擎 API 网关（OpenAI 兼容模式），故为 gateway/<model>；
  #           provider id 由 AI_PROVIDER_ID 指定，与 OPENAI_BASE_URL 一起注入自定义 provider。
  AI_MODEL: ${{ vars.AI_MODEL || 'gateway/deepseek-v4-pro' }}
  AI_PROVIDER_ID: ${{ vars.AI_PROVIDER_ID || 'gateway' }}
  AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '10800000' }}
  # 凭证：AI_API_KEY 为统一入口；OPENAI_API_KEY / DEEPSEEK_API_KEY 作为兼容别名
  AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  OPENAI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  DEEPSEEK_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
  # 模型 API 地址：留空则用火山引擎 API 网关（OpenAI 兼容）默认地址
  OPENAI_BASE_URL: >-
    ${{ vars.OPENAI_BASE_URL || 'https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1' }}

jobs:

  # ── 入口解析：两种入口统一成一份 PR 元数据 ──────────────────────
  prepare:
    name: Prepare repair attempt
    # prepare 是最先运行的 job：它的 runs-on 拿不到 needs 上下文，只能直接读
    # inputs/vars。同样一句话在三处出现（dispatch 表单默认值、这里、下面步骤的
    # env），改默认值时三处要一起改——它们分别对应手动入口、自动入口与校验。
    runs-on: >-
      ${{ fromJSON(inputs.x64_runner_labels || vars.CI_FIX_X64_RUNNER_LABELS ||
          '["self-hosted","Linux","X64","oe-image-x86"]') }}
    timeout-minutes: 15
    outputs:
      source_repo: ${{ steps.resolve.outputs.source_repo }}
      source_platform: ${{ steps.resolve.outputs.source_platform }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_title: ${{ steps.resolve.outputs.pr_title }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      fix_branch: ${{ steps.resolve.outputs.fix_branch }}
      pr_base_branch: ${{ steps.resolve.outputs.pr_base_branch }}
      fix_pr_number: ${{ steps.resolve.outputs.fix_pr_number }}
      attempt: ${{ steps.resolve.outputs.attempt }}
      x64_runner_labels: ${{ steps.resolve.outputs.x64_runner_labels }}
      amd64_runner_labels: ${{ steps.resolve.outputs.amd64_runner_labels }}
      arm64_runner_labels: ${{ steps.resolve.outputs.arm64_runner_labels }}
    env:
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_PLATFORM: ${{ inputs.source_platform }}
      PR_NUMBER: ${{ inputs.pr_number }}
      FIX_PR_NUMBER: ${{ inputs.fix_pr_number || '0' }}
      ATTEMPT: ${{ inputs.attempt || '1' }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}
      # 三类 job 的 runner 标签：调用方输入 → Variables → 默认值。
      X64_RUNNER_LABELS: >-
        ${{ inputs.x64_runner_labels || vars.CI_FIX_X64_RUNNER_LABELS ||
            '["self-hosted","Linux","X64","oe-image-x86"]' }}
      AMD64_RUNNER_LABELS: >-
        ${{ inputs.amd64_runner_labels || vars.CI_FIX_AMD64_RUNNER_LABELS ||
            '["self-hosted","Linux","X64","oe-fix-amd64"]' }}
      ARM64_RUNNER_LABELS: >-
        ${{ inputs.arm64_runner_labels || vars.CI_FIX_ARM64_RUNNER_LABELS ||
            '["self-hosted","Linux","ARM64","oe-fix-arm64"]' }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Resolve PR metadata and runner labels
        id: resolve
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/watch/resolve_pr.py

  # ── 阶段 1: CI 日志分析 ─────────────────────────────────────────
  ci-log-analysis:
    name: Analyze CI failure
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.x64_runner_labels) }}
    timeout-minutes: 60
    outputs:
      # analyze 判定 infra-error（与 Dockerfile 无关）时置 true，跳过修复轮次
      skip_repair: ${{ steps.analysis.outputs.skip_repair }}
    env:
      SOURCE_REPO: ${{ needs.prepare.outputs.source_repo }}
      SOURCE_PLATFORM: ${{ needs.prepare.outputs.source_platform }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      PR_TITLE: ${{ needs.prepare.outputs.pr_title }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      FIX_BRANCH: ${{ needs.prepare.outputs.fix_branch }}
      PR_BASE_BRANCH: ${{ needs.prepare.outputs.pr_base_branch }}
      # 重试时为 fix PR 编号，首次为 0；ci-log-analysis 用它从 fix PR 评论中查最新 build URL
      FIX_PR_NUMBER: ${{ needs.prepare.outputs.fix_pr_number }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout source repo (GitHub)
        if: needs.prepare.outputs.source_platform != 'gitcode'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 1
          path: source-repo

      - name: Checkout source repo (GitCode)
        if: needs.prepare.outputs.source_platform == 'gitcode'
        run: |
          git clone --depth=1 \
            https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ needs.prepare.outputs.source_repo }}.git \
            source-repo

      - name: Set up runner environment
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: x86_64

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt

      - name: Setup Claude Code account credentials
        if: env.AI_RUNNER == 'claude-code-account'
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.claude
          echo "$CLAUDE_CREDENTIALS_JSON" > ~/.claude/.credentials.json
          chmod 600 ~/.claude/.credentials.json

      # 默认后端 opencode 由锁定工具链承担（无需 Node）；
      # claude-code / claude-code-account 后端才需要 npm 安装 Claude Code CLI。
      # npm 缺失时只会得到一句 `npm: command not found`（exit 127），与 PATH
      # 配置错误、包安装失败等完全无法区分，这里提前给出可操作的提示。
      - name: Install Claude Code CLI (non-opencode backends)
        if: env.AI_RUNNER != 'opencode'
        run: |
          if ! command -v npm >/dev/null 2>&1; then
            echo "::error::AI_RUNNER=$AI_RUNNER 需要 Claude Code CLI，但未找到 npm。请在该 runner 上先安装 Node.js：sudo dnf install -y nodejs npm"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Load conventions
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/lib/discover_conventions.py source-repo source-conventions.md

      - name: Run CI log analysis
        id: analysis
        env:
          OPENCODE_BIN: ${{ steps.tools.outputs.opencode_path }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" \
            scripts/stages/ci-log-analysis.py

      - name: Mark failed
        if: failure()
        run: echo "⚠️ ci-log-analysis failed, check workflow logs"

  # ── 阶段 2/3: 修复轮次（每轮 = arm64 复验收口）──────────────────
  round-1:
    name: "Round 1: fix and verify"
    needs: [prepare, ci-log-analysis]
    # infra-error（与 Dockerfile 无关）：analyze 已评论 /retest，跳过全部修复轮次
    if: ${{ needs.ci-log-analysis.outputs.skip_repair != 'true' }}
    uses: ./.github/workflows/_ci_fix_round.yml
    with:
      round: "1"
      verify_count: "0"
      include_arm64_fix: true
      source_repo: ${{ needs.prepare.outputs.source_repo }}
      source_platform: ${{ needs.prepare.outputs.source_platform }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_title: ${{ needs.prepare.outputs.pr_title }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      fix_branch: ${{ needs.prepare.outputs.fix_branch }}
      pr_base_branch: ${{ needs.prepare.outputs.pr_base_branch }}
      arm64_runner_labels: ${{ needs.prepare.outputs.arm64_runner_labels }}
      amd64_runner_labels: ${{ needs.prepare.outputs.amd64_runner_labels }}
    secrets:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}

  # 第 1 轮 arm64 复验失败 → 回修第 2 轮（预算 MAX_VERIFY_ROUNDS=2，共 3 轮）
  round-2:
    name: "Round 2: fix and verify"
    needs: [prepare, ci-log-analysis, round-1]
    if: ${{ needs.round-1.outputs.verify_passed == 'false' }}
    uses: ./.github/workflows/_ci_fix_round.yml
    with:
      round: "2"
      verify_count: "1"
      include_arm64_fix: false
      source_repo: ${{ needs.prepare.outputs.source_repo }}
      source_platform: ${{ needs.prepare.outputs.source_platform }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_title: ${{ needs.prepare.outputs.pr_title }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      fix_branch: ${{ needs.prepare.outputs.fix_branch }}
      pr_base_branch: ${{ needs.prepare.outputs.pr_base_branch }}
      arm64_runner_labels: ${{ needs.prepare.outputs.arm64_runner_labels }}
      amd64_runner_labels: ${{ needs.prepare.outputs.amd64_runner_labels }}
    secrets:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}

  round-3:
    name: "Round 3: fix and verify"
    needs: [prepare, ci-log-analysis, round-2]
    if: ${{ needs.round-2.outputs.verify_passed == 'false' }}
    uses: ./.github/workflows/_ci_fix_round.yml
    with:
      round: "3"
      verify_count: "2"
      include_arm64_fix: false
      source_repo: ${{ needs.prepare.outputs.source_repo }}
      source_platform: ${{ needs.prepare.outputs.source_platform }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_title: ${{ needs.prepare.outputs.pr_title }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      fix_branch: ${{ needs.prepare.outputs.fix_branch }}
      pr_base_branch: ${{ needs.prepare.outputs.pr_base_branch }}
      arm64_runner_labels: ${{ needs.prepare.outputs.arm64_runner_labels }}
      amd64_runner_labels: ${{ needs.prepare.outputs.amd64_runner_labels }}
    secrets:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}

  # ── 阶段 4: 落回源码并提 Fix PR ─────────────────────────────────
  code-fix:
    name: Apply fix and open PR
    # 任意一轮的 arm64 复验通过即可落回；三轮都失败/被跳过时不进入本阶段
    needs: [prepare, ci-log-analysis, round-1, round-2, round-3]
    if: >-
      ${{ always() &&
          (needs.round-1.outputs.verify_passed == 'true' ||
           needs.round-2.outputs.verify_passed == 'true' ||
           needs.round-3.outputs.verify_passed == 'true') }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.x64_runner_labels) }}
    timeout-minutes: 30
    env:
      SOURCE_REPO: ${{ needs.prepare.outputs.source_repo }}
      SOURCE_PLATFORM: ${{ needs.prepare.outputs.source_platform }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      PR_TITLE: ${{ needs.prepare.outputs.pr_title }}
      PR_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      FIX_BRANCH: ${{ needs.prepare.outputs.fix_branch }}
      PR_BASE_BRANCH: ${{ needs.prepare.outputs.pr_base_branch }}
      GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || '' }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up runner environment
        uses: ./.github/actions/phase1-setup

      - name: Install dependencies
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" -m pip install \
            -r requirements.txt


      - name: Normalize GITCODE_FORK_REPO
        if: needs.prepare.outputs.source_platform == 'gitcode'
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" - <<'EOF' >> "$GITHUB_ENV"
          import os, sys
          sys.path.insert(0, '.')
          from scripts.lib.stage_common import normalize_repo
          print(f"GITCODE_FORK_REPO={normalize_repo(os.environ.get('GITCODE_FORK_REPO', ''))}")
          EOF

      - name: Checkout source repo (GitHub)
        if: needs.prepare.outputs.source_platform != 'gitcode'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 0
          path: source-repo

      - name: Checkout source repo (GitCode)
        if: needs.prepare.outputs.source_platform == 'gitcode'
        run: |
          git clone \
            https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ needs.prepare.outputs.source_repo }}.git \
            source-repo

      - name: Setup fix branch
        run: |
          cd source-repo
          git config user.name "${{ vars.GIT_COMMIT_NAME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.GIT_COMMIT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            # GitCode: 直接 fetch PR head ref
            git fetch origin refs/merge-requests/${{ needs.prepare.outputs.pr_number }}/head:pr-head 2>/dev/null || \
              git fetch origin ${{ needs.prepare.outputs.head_sha }} 2>/dev/null || true

            # fix 分支推送到 fork，需要用 fork remote 检查；若未配置 fork 则退回 origin
            FORK_REPO="${GITCODE_FORK_REPO:-}"
            if [ -n "$FORK_REPO" ] && [ "$FORK_REPO" != "$SOURCE_REPO" ]; then
              git remote add fork \
                https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${FORK_REPO}.git
              FIX_BRANCH_REMOTE="fork"
            else
              FIX_BRANCH_REMOTE="origin"
            fi
          else
            git fetch origin pull/${{ needs.prepare.outputs.pr_number }}/head
            FIX_BRANCH_REMOTE="origin"
          fi

          if git ls-remote --exit-code --heads $FIX_BRANCH_REMOTE ${{ needs.prepare.outputs.fix_branch }}; then
            git fetch $FIX_BRANCH_REMOTE ${{ needs.prepare.outputs.fix_branch }}
            git checkout -b ${{ needs.prepare.outputs.fix_branch }} $FIX_BRANCH_REMOTE/${{ needs.prepare.outputs.fix_branch }}
          else
            git checkout ${{ needs.prepare.outputs.head_sha }} 2>/dev/null || git checkout FETCH_HEAD
            git checkout -b ${{ needs.prepare.outputs.fix_branch }}
          fi

      - name: Run code fix
        id: code_fix
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/stages/code-fix.py

      - name: Remove AI artifacts from fix branch
        if: steps.code_fix.outputs.no_changes != 'true'
        run: |
          cd source-repo
          for pattern in ".claude" ".opencode" "__pycache__" ".aider" ".agents"; do
            find . -name "$pattern" -not -path "./.git/*" | while read p; do
              git rm -rf --cached "$p" 2>/dev/null || true
              rm -rf "$p"
            done
          done
          find . -name "*.pyc" -o -name "*.pyo" | grep -v ".git" | while read p; do
            git rm -f --cached "$p" 2>/dev/null || true
            rm -f "$p"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove AI-generated artifacts"
          fi

      - name: Push fix branch
        if: steps.code_fix.outputs.no_changes != 'true'
        run: |
          cd source-repo
          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            PUSH_REPO="${GITCODE_FORK_REPO:-$SOURCE_REPO}"
            git remote set-url origin \
              https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${PUSH_REPO}.git
          else
            git remote set-url origin \
              https://x-access-token:${{ secrets.DISPATCH_TOKEN }}@github.com/${{ needs.prepare.outputs.source_repo }}.git
          fi
          git push origin "+refs/heads/${{ needs.prepare.outputs.fix_branch }}:refs/heads/${{ needs.prepare.outputs.fix_branch }}"

      - name: Create fix PR if not exists
        if: steps.code_fix.outputs.no_changes != 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ "$SOURCE_PLATFORM" = "gitcode" ]; then
            "${RUNNER_TEMP}/phase1-venv/bin/python" - <<'EOF'
          import os, sys
          sys.path.insert(0, '.')
          from scripts.lib.ci_gitcode_api import find_any_pr_by_head_branch, create_pull_request
          from scripts.lib.fix_pr_body import build

          repo      = os.environ['SOURCE_REPO']
          fork_repo = os.environ.get('GITCODE_FORK_REPO', '').strip() or repo
          token     = os.environ['GITCODE_TOKEN']
          fix_br    = os.environ['FIX_BRANCH']
          base_br   = os.environ['PR_BASE_BRANCH']
          meta      = build(int(os.environ['PR_NUMBER']), os.environ['PR_TITLE'])

          head = f"{fork_repo.split('/')[0]}:{fix_br}" if fork_repo != repo else fix_br
          existing = find_any_pr_by_head_branch(repo, fix_br, token, open_only=True)
          if not existing:
              try:
                  create_pull_request(repo, head, base_br, meta['title'], meta['body'], token)
                  print(f"✅ Fix PR created: {meta['title']}")
              except Exception as e:
                  if 'already exists' in str(e).lower() or '422' in str(e):
                      print("✅ Fix PR already exists (detected on create), new commit pushed")
                  else:
                      raise
          else:
              print(f"✅ Fix PR already exists (#{existing['number']}), new commit pushed")
          EOF
          else
            PR_EXISTS=$(gh pr list \
              --repo ${{ needs.prepare.outputs.source_repo }} \
              --head ${{ needs.prepare.outputs.fix_branch }} \
              --state open \
              --json number \
              -q '.[0].number' 2>/dev/null || echo "")
            if [ -z "$PR_EXISTS" ]; then
              "${RUNNER_TEMP}/phase1-venv/bin/python" - <<'PYEOF'
          import os, sys, subprocess
          sys.path.insert(0, '.')
          from scripts.lib.fix_pr_body import build

          meta = build(int(os.environ['PR_NUMBER']), os.environ['PR_TITLE'])
          subprocess.run([
              'gh', 'pr', 'create',
              '--repo', os.environ['SOURCE_REPO'],
              '--title', meta['title'],
              '--body',  meta['body'],
              '--head',  os.environ['FIX_BRANCH'],
              '--base',  os.environ['PR_BASE_BRANCH'],
          ], check=True)
          print(f"✅ Fix PR created: {meta['title']}")
          PYEOF
            else
              echo "✅ Fix PR #$PR_EXISTS already exists, new commit pushed"
            fi
          fi

      - name: Mark failed
        if: failure()
        run: echo "⚠️ code-fix failed, check workflow logs"